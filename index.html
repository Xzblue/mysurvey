<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="stylesheet" href="https://s.pageclip.co/v1/pageclip.css" media="screen">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 生成视频质量调研</title>
    <style>
        :root {
            --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
            --green: #3fb950; --red: #f85149; --radius: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.7;
            padding: 40px 20px; max-width: 1040px; margin: 0 auto;
        }
        header { position: relative; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        h1 { font-size: 1.65rem; font-weight: 600; letter-spacing: -0.02em; }
        .subtitle { color: var(--muted); font-size: 0.92rem; margin-top: 6px; }

        /* ===== 语言切换 ===== */
        .lang-toggle {
            position: absolute; top: 0; right: 0;
            display: inline-flex; align-items: center; gap: 7px;
            padding: 6px 10px;
            border: 1px solid var(--border); border-radius: 999px;
            background: var(--surface); color: var(--muted);
            font: inherit; font-size: 11px; font-weight: 700;
            cursor: pointer; transition: border-color .15s;
        }
        .lang-toggle:hover { border-color: var(--accent); }
        .lang-opt { opacity: .5; transition: opacity .15s, color .15s; }
        .lang-opt.active { color: var(--accent); opacity: 1; }
        .toggle-track {
            position: relative; width: 30px; height: 17px;
            border: 1px solid var(--border); border-radius: 999px; background: #21262d;
        }
        .toggle-knob {
            position: absolute; top: 2px; left: 2px; width: 11px; height: 11px;
            border-radius: 50%; background: var(--muted);
            transition: transform .2s ease, background .2s ease;
        }
        html[lang="zh-CN"] .toggle-knob { transform: translateX(13px); background: var(--accent); }
        @media (max-width: 560px) {
            .lang-toggle { position: static; margin-bottom: 16px; }
        }

        section {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
        }
        section h2 {
            font-size: 1.1rem; font-weight: 600; margin-bottom: 4px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-desc { color: var(--muted); font-size: 0.86rem; margin-bottom: 18px; }

        /* ===== 场景内分块 ===== */
        .block-title {
            font-size: 0.95rem; font-weight: 600; margin: 26px 0 12px;
            padding-left: 10px; border-left: 3px solid var(--accent);
        }
        .ref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 600px) { .ref-grid { grid-template-columns: 1fr; } }
        .ref-grid figure {
            background: #0d1117; border: 1px solid var(--border);
            border-radius: 8px; padding: 10px; margin: 0;
        }
        .ref-grid video, .ref-grid img {
            display: block; width: 100%; border-radius: 6px; background: #000;
            aspect-ratio: 16 / 9; object-fit: contain;
        }
        .ref-grid figcaption {
            margin-top: 8px; font-size: 0.8rem; color: var(--muted); text-align: center;
        }
        .note-line { margin-top: 10px; font-size: 0.8rem; color: var(--muted); }

        .media-box {
            background: #0d1117; border: 1px solid var(--border); border-radius: 8px;
            padding: 8px;
        }
        .media-box video, .media-box img { display: block; max-width: 100%; width: 100%; border-radius: 6px; }

        .field { margin-bottom: 18px; }
        .field:last-child { margin-bottom: 0; }
        label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; }
        .hint { color: var(--muted); font-size: 0.8rem; font-weight: 400; margin-left: 6px; }
        .rating-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .rating-group label {
            display: flex; align-items: center; gap: 5px; font-weight: 400;
            background: #0d1117; border: 1px solid var(--border);
            border-radius: 6px; padding: 7px 13px; cursor: pointer; font-size: 0.88rem;
            margin-bottom: 0;
        }
        .rating-group label:hover { border-color: var(--accent); }
        .rating-group input { accent-color: var(--accent); }

        /* 选中态（多选） */
        .rating-group label:has(input:checked) {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(88, 166, 255, .08);
        }
        /* 每题最多选 2 个的提示行 */
        .group-hint { margin-top: 6px; color: var(--red); font-size: 0.8rem; }

        /* 未作答高亮 */
        .missing {
            box-shadow: 0 0 0 2px rgba(248, 81, 73, .55);
            border-radius: 10px;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--accent); color: #0d1117; border: none;
            border-radius: 8px; padding: 12px 28px; font-size: 1rem;
            font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        #status { margin-top: 14px; font-size: 0.9rem; min-height: 1.4em; }
        .status-ok { color: var(--green); }
        .status-err { color: var(--red); }

        .success-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 40px 24px; text-align: center;
        }
        .success-title {
            font-size: 1.15rem; font-weight: 600; color: var(--green); margin-bottom: 24px;
        }
        .success-card .btn { width: auto; padding: 10px 28px; margin: 0 auto; }

        /* ==========================================================
           向导模式：进度条 + 底部导航
           ========================================================== */
        .wizard-progress { margin: 0 0 20px; scroll-margin-top: 24px; }
        .progress-track {
            height: 6px; border-radius: 999px; background: #21262d; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0; border-radius: 999px;
            background: linear-gradient(90deg, #2f81f7, var(--accent));
            transition: width .28s ease;
        }
        .progress-text {
            margin-top: 8px; text-align: center;
            font-size: 0.8rem; color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .wizard-nav {
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            margin-top: 26px; padding-top: 18px;
            border-top: 1px solid var(--border);
        }
        .wizard-nav .btn {
            flex: 1 1 140px; width: auto; margin: 0;
        }
        .wizard-nav .btn.ghost {
            background: transparent; color: var(--text);
            border: 1px solid var(--border);
        }
        .wizard-nav .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
        .wizard-nav .wizard-error {
            flex: 1 1 100%; margin: 4px 0 0;
            color: var(--red); font-size: 0.84rem; min-height: 1.2em;
        }

        /* 离屏预加载容器（1x1，不可见，保证浏览器愿意预取） */
        .preload-host {
            position: fixed; top: 0; left: -9999px;
            width: 1px; height: 1px; overflow: hidden; opacity: 0;
            pointer-events: none; z-index: -1;
        }

        /* ==========================================================
           输入方式偏好：对照卡片结构（深色化）
           ========================================================== */
        .method-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 14px;
        }

        .method-card {
            position: relative;
            display: grid;
            grid-template-columns: 22px 32px minmax(0, 1fr);
            gap: 12px;
            align-items: start;
            margin: 0;
            padding: 20px;
            background: #0d1117;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 400;
            transition: border-color .18s ease, box-shadow .18s ease;
        }
        .method-card:hover { border-color: #4b6b95; }
        .method-card:has(input:checked) {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(88, 166, 255, .18);
        }
        .method-card input[type="radio"] {
            position: absolute; opacity: 0; pointer-events: none;
        }
        .radio-dot {
            width: 20px; height: 20px; margin-top: 3px;
            border: 2px solid #4a5568; border-radius: 50%;
            background: transparent;
            transition: border .15s ease;
        }
        .method-card:has(input:checked) .radio-dot { border: 6px solid var(--accent); }
        .method-letter {
            display: grid; place-items: center;
            width: 30px; height: 26px;
            border-radius: 7px;
            background: rgba(88, 166, 255, .15);
            color: var(--accent);
            font-size: .78rem; font-weight: 800;
        }
        .method-head { display: block; min-width: 0; }
        .method-name {
            display: block;
            font-size: .98rem; font-weight: 600; color: var(--text);
        }
        .method-card:has(input:checked) .method-name { color: var(--accent); }
        .method-desc {
            display: block;
            margin-top: 3px;
            font-size: .82rem; color: var(--muted); line-height: 1.5;
        }

        /* 输入 → 输出 对照网格 */
        .comparison-grid {
            grid-column: 3;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 30px minmax(0, .72fr);
            gap: 12px;
            align-items: center;
            min-width: 0;
            margin-top: 14px;
        }
        .input-panel, .output-panel {
            position: relative;
            display: block;
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
        }
        .panel-label {
            position: absolute; z-index: 3; top: 9px; left: 9px;
            padding: 5px 8px; border-radius: 6px;
            background: rgba(1, 4, 9, .85);
            color: #e6edf3;
            font-size: 10px; font-weight: 700; letter-spacing: .04em;
        }
        .input-panel > img,
        .trajectory-canvas > img,
        .output-panel video {
            display: block; width: 100%; aspect-ratio: 16 / 9;
            object-fit: cover; background: #000;
        }
        .flow-arrow { color: #4a5568; font-size: 22px; text-align: center; }

        /* 选项 A：文本提示词 */
        .prompt-box {
            display: grid; grid-template-columns: 26px minmax(0, 1fr);
            gap: 8px;
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }
        .prompt-icon {
            display: grid; place-items: center;
            width: 26px; height: 26px; border-radius: 6px;
            background: rgba(88, 166, 255, .15); color: var(--accent);
            font-size: 10px; font-weight: 800;
        }
        .prompt-text { color: #a9b6c8; font-size: .68rem; line-height: 1.5; }

        /* 选项 B：手绘轨迹 */
        .trajectory-canvas { position: relative; display: block; }
        .trajectory-overlay {
            position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
        }
        .trajectory-shadow {
            fill: none; stroke: rgba(0, 0, 0, .35); stroke-width: 9;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .trajectory-line {
            fill: none; stroke: #ffcc33; stroke-width: 5;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .trajectory-end-halo { fill: rgba(255, 255, 255, .9); }
        .trajectory-point.start { fill: #22c55e; stroke: #fff; stroke-width: 2; }
        .trajectory-point.end { fill: #ef4444; stroke: #fff; stroke-width: 2; }
        .trajectory-tag {
            position: absolute; z-index: 2;
            padding: 4px 7px; border-radius: 6px;
            color: #fff; font-size: 9px; font-weight: 900; letter-spacing: .05em;
            box-shadow: 0 3px 8px rgba(0, 0, 0, .3);
        }
        .start-tag { right: 10%; bottom: 15%; background: #16a34a; }
        .end-tag { left: 31%; top: 36%; background: #dc2626; }
        .draw-toolbar {
            position: absolute; z-index: 3; right: 8px; top: 8px;
            display: flex; gap: 3px; padding: 4px;
            border: 1px solid var(--border); border-radius: 8px;
            background: rgba(13, 17, 23, .88);
            backdrop-filter: blur(6px);
        }
        .tool {
            display: grid; place-items: center;
            width: 24px; height: 22px; border-radius: 5px;
            color: var(--muted); font-size: 13px;
        }
        .tool.active { background: rgba(88, 166, 255, .18); color: var(--accent); }

        /* 选项 C：相机参数 */
        .parameter-panel {
            min-height: 300px;
            padding: 40px 12px 12px;
            background: linear-gradient(145deg, #161b22, #0d1117);
        }
        .upload-row {
            display: grid; grid-template-columns: 30px minmax(0, 1fr) 20px;
            align-items: center; gap: 8px;
            padding: 8px;
            border: 1px solid var(--border); border-radius: 8px;
            background: #0d1117;
        }
        .upload-icon {
            display: grid; place-items: center;
            width: 28px; height: 28px; border-radius: 7px;
            background: rgba(88, 166, 255, .15); color: var(--accent);
            font-size: 15px; font-weight: 800;
        }
        .upload-row strong { display: block; font-size: .7rem; font-weight: 600; color: var(--text); }
        .upload-row small { display: block; margin-top: 2px; color: var(--muted); font-size: .62rem; }
        .file-check {
            display: grid; place-items: center;
            width: 18px; height: 18px; border-radius: 50%;
            background: rgba(63, 185, 80, .18); color: var(--green);
            font-size: .7rem; font-weight: 900;
        }
        .matrix-preview-row {
            display: grid;
            grid-template-columns: minmax(0, .7fr) minmax(0, 1.3fr);
            gap: 6px;
            margin: 8px 0;
        }
        .matrix-card {
            min-width: 0;
            padding: 8px 9px 9px;
            border: 1px solid var(--border); border-radius: 8px;
            background: #0d1117;
        }
        .matrix-card > b {
            display: block; margin-bottom: 6px;
            color: var(--muted); font-size: .56rem; font-weight: 600; text-align: center;
        }
        .matrix-brackets {
            position: relative;
            display: grid; gap: 3px 6px;
            padding: 3px 8px;
        }
        .matrix-brackets::before,
        .matrix-brackets::after {
            position: absolute; top: 0; bottom: 0; width: 5px;
            border-top: 1px solid #3d4757; border-bottom: 1px solid #3d4757;
            content: "";
        }
        .matrix-brackets::before { left: 0; border-left: 1px solid #3d4757; }
        .matrix-brackets::after { right: 0; border-right: 1px solid #3d4757; }
        .matrix-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .matrix-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .matrix-brackets code {
            min-width: 0;
            color: #9fb0c7;
            font-size: .5rem; line-height: 1.4;
            text-align: right; font-variant-numeric: tabular-nums;
        }
        .pose-strip { display: flex; align-items: center; gap: 4px; overflow: hidden; }
        .pose-card {
            flex: 1 1 70px; min-width: 60px;
            padding: 6px;
            border: 1px solid var(--border); border-radius: 7px;
            background: #0d1117; text-align: center;
        }
        .pose-card b, .pose-card code, .pose-card small { display: block; }
        .pose-card b { color: var(--muted); font-size: .56rem; font-weight: 600; }
        .pose-card code { margin: 5px 0 3px; color: var(--accent); font-size: .66rem; font-weight: 800; }
        .pose-card small { color: #6b7688; font-size: .52rem; }
        .pose-card.expanded { border-color: rgba(88, 166, 255, .5); background: rgba(88, 166, 255, .1); }
        .pose-link { color: #4a5568; font-weight: 800; font-size: .7rem; }
        .sequence-caption {
            display: block; margin-top: 8px;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .62rem; text-align: center; letter-spacing: .06em;
        }

        @media (max-width: 820px) {
            .method-card { padding: 16px; grid-template-columns: 22px 30px minmax(0, 1fr); }
            .comparison-grid { grid-column: 1 / -1; grid-template-columns: 1fr; }
            .flow-arrow { transform: rotate(90deg); }
            .parameter-panel { min-height: 0; }
        }
        @media (max-width: 520px) {
            .method-card { padding: 12px; border-radius: 10px; }
            .method-name { font-size: .92rem; }
            .matrix-preview-row { grid-template-columns: 1fr; }
            .matrix-brackets code { font-size: .55rem; }
            .pose-card:nth-of-type(n+4), .pose-link:nth-of-type(n+4) { display: none; }
        }
    </style>
</head>
<body>

<header>
    <button class="lang-toggle" id="langToggle" type="button" aria-pressed="false" aria-label="Switch to English">
        <span class="lang-opt active">EN</span><span class="toggle-track"><span class="toggle-knob"></span></span><span class="lang-opt">中文</span>
    </button>
    <h1 data-i18n="title">AI 生成视频质量调研</h1>
    <p class="subtitle" data-i18n="subtitle">
        接下来有 21个题目。请按页面提示一步步完成本次问卷，预计 20–30 分钟。
    </p>
</header>

<form id="surveyForm"
      action="https://send.pageclip.co/d5qrOrsUcO6eVJyrr11zccjmMq5AEXaW/survey"
      class="pageclip-form"
      method="post">

    <!-- ========== 进度条 ========== -->
    <div class="wizard-progress" id="wizardProgress">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">第 1 / 21 题</div>
    </div>

    <!-- ========== 输入方式偏好（第 1 题） ========== -->
    <section class="wizard-step" id="stepPreference">
        <h2 data-i18n="inputHeading">你更倾向于用哪种方式指定相机运动？</h2>
        <p class="section-desc" data-i18n="inputDesc">
            假设你希望基于一张静态图像生成视频，并控制视频中的相机运动。请综合考虑交互性、便利性、准确性和实际可用性，选择你最愿意使用的方式。
        </p>

        <div class="field">
            <label>
                <span data-i18n="inputLabel">你更愿意用哪种方式描述相机运动？</span><span class="hint" data-i18n="inputHint">选 1 个，必答</span>
            </label>

            <div class="method-grid">

                <!-- A · 文本描述 -->
                <label class="method-card">
                    <input type="radio" name="input_method" value="text">
                    <span class="radio-dot" aria-hidden="true"></span>
                    <span class="method-letter">A</span>
                    <span class="method-head">
                        <span class="method-name" data-i18n="aTitle">用文字描述</span>
                        <span class="method-desc" data-i18n="aDesc">像写提示词一样，用一段话说明镜头要怎么移动。</span>
                    </span>

                    <span class="comparison-grid">
                        <span class="input-panel">
                            <span class="panel-label" data-i18n="userInput">用户输入</span>
                            <img data-src="media/reference_frame.png" alt="用户输入的参考图像">
                            <span class="prompt-box">
                                <span class="prompt-icon" aria-hidden="true">Aa</span>
                                <span class="prompt-text" data-i18n="prompt">初始时，相机位于红色卡车后方略高的位置，沿道路方向向前观察，并使卡车尾部保持在画面中央附近。相机以恒定的跟随距离和高度平滑地随卡车向前移动。当卡车进入路口时，相机沿道路的缓慢左弯连续向左偏航，保持水平且不发生滚转。完成左转后，相机轨迹稍微向车道中央偏移，以安全绕过路边的路牌及其附近的电线杆，并保持足够间距，避免路牌或电线杆遮挡卡车。越过路牌后，相机应平滑地重新将卡车置于画面中央，并继续沿弯曲道路跟随。整个过程中保持焦距、相机高度、俯仰角和跟随距离稳定；不要变焦，不要突然加速或旋转，不要与场景物体发生碰撞，也不要产生明显抖动。</span>
                            </span>
                        </span>
                        <span class="flow-arrow" aria-hidden="true">→</span>
                        <span class="output-panel">
                            <span class="panel-label" data-i18n="videoOutput">生成视频 · 真实输出</span>
                            <video muted loop controls playsinline preload="none" data-src="media/generated_video.mp4"></video>
                        </span>
                    </span>
                </label>

                <!-- B · 手绘 2D 轨迹 -->
                <label class="method-card">
                    <input type="radio" name="input_method" value="draw">
                    <span class="radio-dot" aria-hidden="true"></span>
                    <span class="method-letter">B</span>
                    <span class="method-head">
                        <span class="method-name" data-i18n="bTitle">在图片上画轨迹</span>
                        <span class="method-desc" data-i18n="bDesc">直接在图片上画出相机要走的路线，起点和终点一目了然。</span>
                    </span>

                    <span class="comparison-grid">
                        <span class="input-panel">
                            <span class="panel-label" data-i18n="userInput">用户输入</span>
                            <span class="trajectory-canvas">
                                <img data-src="media/reference_frame.png" alt="在图像上绘制的相机运动轨迹">
                                <svg class="trajectory-overlay" viewBox="0 0 896 512" preserveAspectRatio="none" aria-hidden="true">
                                    <path class="trajectory-shadow" d="M 820 454 C 755 372, 674 285, 574 245 S 360 230, 260 165" />
                                    <path class="trajectory-line" d="M 820 454 C 755 372, 674 285, 574 245 S 360 230, 260 165" />
                                    <circle class="trajectory-end-halo start" cx="820" cy="454" r="13" />
                                    <circle class="trajectory-point start" cx="820" cy="454" r="8" />

    container.innerHTML = sceneNames.map((cn, idx) => {

    const MAX_CHOICES = 2;

        if (hint && hint.classList.contains('group-hint')) hint.hidden = true;

    const preloadHost = document.createElement('div');
    preloadHost.className = 'preload-host';
    preloadHost.setAttribute('aria-hidden', 'true');

    const preloaded = new Map();
    const LOOKAHEAD = 2;

    function mediaUrlsOf(step) {
        const urls = [];
        if (!step) return urls;
        step.querySelectorAll('[data-src]').forEach((el) => urls.push(el.dataset.src));
        return urls;
    }

    function preloadStep(index) {
        if (index < 0 || index >= steps.length) return;
        mediaUrlsOf(steps[index]).forEach((url) => {
            if (!url || preloaded.has(url)) return;

            if (/\.(mp4|webm|ogv|mov)(\?|$)/i.test(url)) {
                const v = document.createElement('video');
                v.preload = 'auto';
                v.muted = true;
                v.playsInline = true;
                v.setAttribute('aria-hidden', 'true');
                v.src = url;
                preloadHost.appendChild(v);
                v.load();
                preloaded.set(url, v);
            } else {
                const img = new Image();
                img.decoding = 'async';
                img.src = url;
                preloaded.set(url, img);
            }
        });
    }

    function trimPreloads(index) {
        const keep = new Set();
        for (let i = index; i <= index + LOOKAHEAD; i++) {
            mediaUrlsOf(steps[i]).forEach((u) => keep.add(u));
        }
        preloaded.forEach((el, url) => {
            if (keep.has(url)) return;
            if (el.tagName === 'VIDEO') {
                el.removeAttribute('src');
                try { el.load(); } catch (e) {}
                el.remove();
            } else {
                el.src = '';
            }
            preloaded.delete(url);
        });
    }

    /** 把当前题目的媒体挂到 DOM 上；同一题内多个视频等全部就绪后停在同一时间点 */
    function attachMedia(step) {
        if (!step) return;

        step.querySelectorAll('video[data-src]').forEach((v) => {
            if (v.hasAttribute('src')) return;
            v.preload = 'auto';
            v.setAttribute('src', v.dataset.src);
            v.load();
        });

        step.querySelectorAll('img[data-src]').forEach((img) => {
            if (img.hasAttribute('src')) return;
            img.setAttribute('src', img.dataset.src);
        });

        const vids = Array.from(step.querySelectorAll('video'));
        if (vids.length > 1) {
            let readyCount = 0;
            vids.forEach((v) => {
                const markReady = () => {
                    readyCount++;
                    if (readyCount !== vids.length) return;
                    // 只在首次进入该题时统一到代表性画面，切回时保留用户进度
                    if (step.dataset.mediaInitialized === '1') return;
                    step.dataset.mediaInitialized = '1';

                    const durations = vids.map((x) =>
                        (isFinite(x.duration) && x.duration > 0 ? x.duration : Infinity)
                    );
                    const minDur = Math.min(...durations);
                    const target = Number.isFinite(minDur) ? Math.min(1.5, minDur / 3) : 1.5;
                    vids.forEach((x) => {
                        try { x.currentTime = target; } catch (e) {}
                    });
                };
                if (v.readyState >= 1) markReady();
                else v.addEventListener('loadedmetadata', markReady, { once: true });
            });
        }
    }

    /* ============================================================
       4.5 同一场景内两个视频的联动播放
           点击任意一个的播放/暂停/进度条，另一个同步跟随
       ============================================================ */
    function linkVideos(step) {
        const vids = Array.from(step.querySelectorAll('video'));
        if (vids.length !== 2) return;

        const [a, b] = vids;
        let syncing = false;

        const syncCurrentTime = (from, to) => {
            if (!isFinite(from.currentTime)) return;
            if (to.readyState < 1) return;                 // 目标还没元数据，seek 无效
            if (Math.abs(to.currentTime - from.currentTime) < 0.15) return;
            try { to.currentTime = from.currentTime; } catch (e) {}
        };

        vids.forEach((video) => {
            const other = video === a ? b : a;

            // 播放：先对齐进度，再带动另一个一起播
            video.addEventListener('play', () => {
                if (syncing) return;
                syncing = true;

                const atEnd = isFinite(video.duration)
                    && video.duration > 0
                    && video.currentTime >= video.duration - 0.05;

                if (atEnd) {
                    // 从结尾重新播放时，两个都回到开头，保证同步
                    try { video.currentTime = 0; } catch (e) {}
                    try { if (other.readyState >= 1) other.currentTime = 0; } catch (e) {}
                } else {
                    syncCurrentTime(video, other);
                }

                if (other.paused) {
                    const p = other.play();
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                }
                syncing = false;
            });

            // 暂停：另一个也暂停
            video.addEventListener('pause', () => {
                if (syncing) return;
                syncing = true;
                if (!other.paused) other.pause();
                syncing = false;
            });

            // 拖动进度条：另一个跟随
            video.addEventListener('seeked', () => {
                if (syncing) return;
                syncing = true;
                syncCurrentTime(video, other);
                syncing = false;
            });

            // 倍速：另一个跟随
            video.addEventListener('ratechange', () => {
                if (syncing) return;
                syncing = true;
                if (other.playbackRate !== video.playbackRate) {
                    other.playbackRate = video.playbackRate;
                }
                syncing = false;
            });

            // 播放中轻微漂移校正（偏差较大时才纠正，避免频繁 seek 抖动）
            video.addEventListener('timeupdate', () => {
                if (video.paused || other.paused) return;
                if (Math.abs(other.currentTime - video.currentTime) > 0.5) {
                    try { other.currentTime = video.currentTime; } catch (e) {}
                }
            });

            // 一个播完：另一个也停下，并把进度对齐到结束位置
            video.addEventListener('ended', () => {
                if (syncing) return;
                syncing = true;
                if (!other.paused) other.pause();
                try {
                    if (other.readyState >= 1) {
                        const t = Math.min(video.currentTime, other.duration || video.currentTime);
                        other.currentTime = t;
                    }
                } catch (e) {}
                syncing = false;
            });
        });
    }

    /* ============================================================
       5. 题目切换逻辑
       ============================================================ */
    function updateProgress(index) {
        const total = steps.length;
        const pct = ((index + 1) / total) * 100;
        progressFill.style.width = pct + '%';
        progressText.textContent = currentLanguage === 'zh'
            ? `第 ${index + 1} / ${total} 题`
            : `Question ${index + 1} of ${total}`;
    }

    function showStep(index, opts) {
        const options_ = opts || {};
        index = Math.max(0, Math.min(steps.length - 1, index));

        // 离开当前题目前，暂停其中的视频，避免后台继续播放
        const leaving = steps[currentStep];
        if (leaving && leaving !== steps[index]) {
            leaving.querySelectorAll('video').forEach((v) => {
                if (!v.paused) v.pause();
            });
        }

        currentStep = index;

        steps.forEach((s, i) => {
            s.hidden = i !== index;
            s.classList.toggle('is-active', i === index);
        });

        const step = steps[index];
        step.appendChild(nav);           // 导航跟着当前题目走

        prevBtn.hidden = index === 0;
        nextBtn.hidden = index === steps.length - 1;
        submitBtn.hidden = index !== steps.length - 1;

        navError.hidden = true;
        navError.textContent = '';

        attachMedia(step);               // 当前题：立即加载
        preloadStep(index + 1);          // 预加载下一题
        preloadStep(index + 2);          // 再下一题
        trimPreloads(index);             // 释放远处的资源

        updateProgress(index);

        if (options_.scroll !== false) {
            progressWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    /* 校验：radio 必须恰好选 1 个；checkbox 必须选 1–2 个 */
    function validateStep(step) {
        const names = new Set();
        step.querySelectorAll('input[type="radio"][name], input[type="checkbox"][name]')
            .forEach((i) => names.add(i.name));

        let ok = true;
        names.forEach((name) => {
            const group = Array.from(step.querySelectorAll(`input[name="${name}"]`));
            if (!group.length) return;
            const checked = group.filter((i) => i.checked);
            const isMulti = group[0].type === 'checkbox';

            const valid = isMulti
                ? (checked.length >= 1 && checked.length <= MAX_CHOICES)
                : (checked.length === 1);

            const wrap = group[0].closest('.rating-group') || group[0].closest('.method-grid');
            if (wrap) wrap.classList.toggle('missing', !valid);
            if (!valid) ok = false;
        });
        return ok;
    }

    function goNext() {
        const step = steps[currentStep];
        if (!validateStep(step)) {
            navError.textContent = translations[currentLanguage].needAnswer;
            navError.hidden = false;
            const firstMissing = step.querySelector('.missing');
            if (firstMissing) firstMissing.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }
        showStep(currentStep + 1);
    }

    nextBtn.addEventListener('click', goNext);
    prevBtn.addEventListener('click', () => showStep(currentStep - 1));

    /* ============================================================
       5.5 提交前把多选值合并成单字段（保证 Pageclip 存得下）
       ============================================================ */
    let normalizedState = null;

    function normalizeMultiSelect() {
        if (normalizedState) return;
        normalizedState = { hidden: [], checkboxes: [] };

        const groups = new Map();
        form.querySelectorAll('input[type="checkbox"][name]').forEach((input) => {
            if (!groups.has(input.name)) groups.set(input.name, []);
            if (input.checked) groups.get(input.name).push(input.value);
        });

        groups.forEach((values, name) => {
            const hidden = document.createElement('input');
            hidden.type = 'hidden';
            hidden.name = name;
            hidden.value = values.join(',');      // 例如 "2,5"
            form.appendChild(hidden);
            normalizedState.hidden.push(hidden);

            form.querySelectorAll(`input[type="checkbox"][name="${name}"]`).forEach((el) => {
                normalizedState.checkboxes.push({ el, name });
                el.disabled = true;               // disabled 不参与提交
                el.removeAttribute('name');
            });
        });
    }

    /** 提交失败时还原，允许用户修改后再次提交 */
    function restoreMultiSelect() {
        if (!normalizedState) return;
        normalizedState.hidden.forEach((h) => h.remove());
        normalizedState.checkboxes.forEach(({ el, name }) => {
            el.disabled = false;
            el.setAttribute('name', name);
        });
        normalizedState = null;
    }

    // 兜底：提交前再整体校验一次（捕获阶段，先于 Pageclip 处理）
    form.addEventListener('submit', function (e) {
        for (let i = 0; i < steps.length; i++) {
            if (!validateStep(steps[i])) {
                e.preventDefault();
                e.stopPropagation();
                showStep(i);
                navError.textContent = translations[currentLanguage].needAnswer;
                navError.hidden = false;
                return;
            }
        }
        normalizeMultiSelect();   // 全部通过后再整理，避免中途禁用选项
    }, true);

    /* ============================================================
       6. 语言应用
       ============================================================ */
    function applyLanguage(lang) {
        currentLanguage = lang;
        const dict = translations[lang];

        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.title = dict.pageTitle;

        document.querySelectorAll('[data-i18n]').forEach((el) => {
            const key = el.dataset.i18n;
            if (dict[key] !== undefined) el.textContent = dict[key];
        });

        // 含 HTML 标签的文案（如 q2 里的 <strong>）
        document.querySelectorAll('[data-i18n-html]').forEach((el) => {
            const key = el.dataset.i18nHtml;
            if (dict[key] !== undefined) el.innerHTML = dict[key];
        });

        document.querySelectorAll('[data-scene-num]').forEach((el) => {
            const n = Number(el.dataset.sceneNum);
            el.textContent = lang === 'zh' ? `场景${sceneNames[n - 1]}` : `Scene ${n}`;
        });

        document.querySelectorAll('[data-opt-num]').forEach((el) => {
            const n = Number(el.dataset.optNum);
            el.textContent = lang === 'zh' ? `${n} 号` : `Option ${n}`;
        });

        document.querySelectorAll('[data-frame]').forEach((el) => {
            const f = el.dataset.frame;
            el.textContent = lang === 'zh' ? `第 ${f} 帧` : `Frame ${f}`;
        });

        // 切换语言时清掉残留的“最多选 2 个”提示
        document.querySelectorAll('.group-hint').forEach((h) => { h.hidden = true; });

        prevBtn.textContent = dict.prev;
        nextBtn.textContent = dict.next;
        submitBtn.textContent = dict.submit;

        updateProgress(currentStep);

        const opts = langToggle.querySelectorAll('.lang-opt');
        opts[0].classList.toggle('active', lang === 'en');
        opts[1].classList.toggle('active', lang === 'zh');
        langToggle.setAttribute('aria-pressed', lang === 'zh');
        langToggle.setAttribute('aria-label', lang === 'zh' ? 'Switch to English' : '切换为中文');

        if (statusEl.dataset.state === 'submitting') {
            statusEl.textContent = dict.submitting;
        }

        localStorage.setItem('survey-language', lang);
    }

    langToggle.addEventListener('click', () => {
        applyLanguage(currentLanguage === 'en' ? 'zh' : 'en');
    });

    /* ============================================================
       7. Pageclip 提交状态
       ============================================================ */
    const observer = new MutationObserver(() => {
        if (form.classList.contains('pageclip-form--success')) {
            form.style.display = 'none';
            successBox.style.display = 'block';
            statusEl.textContent = '';
            statusEl.dataset.state = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        else if (form.classList.contains('pageclip-form--submitting')) {
            statusEl.dataset.state = 'submitting';
            statusEl.textContent = translations[currentLanguage].submitting;
            statusEl.className = '';
            submitBtn.disabled = true;
        }
        else if (statusEl.dataset.state === 'submitting') {
            statusEl.dataset.state = '';
            statusEl.textContent = '';
            submitBtn.disabled = false;
            restoreMultiSelect();          // 提交失败：还原可编辑状态
        }
    });

    observer.observe(form, { attributes: true, attributeFilter: ['class'] });

    /* ============================================================
       8. 初始化
       ============================================================ */
    // 为每个场景题的两个视频绑定联动播放
    document.querySelectorAll('.wizard-step[data-scene]').forEach(linkVideos);

    applyLanguage(currentLanguage);
    showStep(0, { scroll: false });

})();
</script>
